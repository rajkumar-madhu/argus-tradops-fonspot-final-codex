apiVersion: v1
kind: Secret
metadata:
  name: tradeops-secrets
  namespace: tradeops
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql+psycopg://tradeops:CHANGE_ME@tradeops-postgres:5432/tradeops"
  ELASTICSEARCH_URL: "https://elk.example.com:9200"
  ELASTICSEARCH_API_KEY: "REPLACE_ME"
  KEYCLOAK_URL: "https://keycloak.example.com"
  KEYCLOAK_REALM: "tradeops"
  KEYCLOAK_CLIENT_ID: "tradeops-web"
  # Prefer External Secrets/Vault in production instead of storing secrets in Git.
