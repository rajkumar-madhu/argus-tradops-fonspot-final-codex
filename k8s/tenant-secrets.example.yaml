# Per-tenant Elasticsearch credentials, mounted as files on the API pod at
# /etc/tradeops/tenant-secrets. Never store these keys in the tenants table;
# the row only names a credentials_ref that must match the file prefix.
#
#   kubectl -n tradeops apply -f k8s/tenant-secrets.example.yaml
#
# Prefer External Secrets (external-secrets.example.yaml) in production.
# Do not apply this file with placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: tradeops-tenant-secrets
  namespace: tradeops
type: Opaque
stringData:
  # Filenames: <credentials_ref>.es_api_key
  #        or: <credentials_ref>.es_username + <credentials_ref>.es_password
  # acme.es_api_key: "REPLACE_ME_READ_ONLY_KEY"
