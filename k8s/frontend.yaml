apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradeops-web
  namespace: tradeops
spec:
  replicas: 2
  selector:
    matchLabels: {app: tradeops-web}
  template:
    metadata:
      labels: {app: tradeops-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: tradeops-web}}
      containers:
        - name: web
          image: your-registry/tradeops-frontend:RELEASE_REQUIRED
          env:
            # Read at request time by app/layout.tsx and serialised into the page as
            # window.__TRADEOPS_CONFIG__. Do NOT use NEXT_PUBLIC_API_URL here: Next.js
            # inlines NEXT_PUBLIC_* at build time, so setting it as a pod env has no
            # effect and the browser would keep calling the build-time host.
            # This must be the URL the *browser* can reach, not the in-cluster Service.
            - {name: API_URL, value: "https://tradeops-api.example.com"}
            # Server components and the export routes call the API over the Service.
            - {name: INTERNAL_API_URL, value: "http://tradeops-api:8000"}
          ports: [{name: http, containerPort: 3000}]
          # /healthz renders no page and calls no backend, so an API outage marks
          # the API pods unready without restarting the web tier.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
          lifecycle:
            # Give the Service endpoints time to drop this pod before SIGTERM, so
            # in-flight and newly routed requests are not refused during rollouts.
            preStop:
              exec: {command: ["sleep", "5"]}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # Next.js writes its build/image cache under .next/cache at runtime.
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tradeops-web
  namespace: tradeops
spec:
  selector: {app: tradeops-web}
  ports: [{name: http, port: 3000, targetPort: http}]
