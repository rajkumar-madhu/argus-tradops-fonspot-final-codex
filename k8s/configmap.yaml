apiVersion: v1
kind: ConfigMap
metadata:
  name: tradeops-config
  namespace: tradeops

data:
  TRADEOPS_ENV: "production"
  TRADEOPS_DEMO_MODE: "false"
  AUTH_DISABLED: "false"
  KEYCLOAK_URL: "https://keycloak.finspot.in"
  KEYCLOAK_REALM: "Devops-common-cicd"
  KEYCLOAK_CLIENT_ID: "tradeops-web"
  CORS_ORIGINS: "https://tradeops.example.com"
  REDIS_URL: "redis://tradeops-redis:6379/0"
  REDIS_PUBLIC_LABEL: "tradeops-redis"
  NOREN_ORDER_INDEX: "noren-ordupd-intraday"
  NOREN_LOGIN_INDEX: "noren-login-intraday"
  NOREN_LOGOUT_INDEX: "noren-logout-intraday"
  NOREN_YEL_INDEX: "noren-yel_connected-intraday"
  NOREN_ALL_INDEX: "noren-*-intraday"
  NOREN_TIMESTAMP_FIELD: "NorenTimeStamp_N"
  COLLECTOR_INTERVAL_SECONDS: "2"
  COLLECTOR_LOOKBACK: "2h"
  RCA_LOOKBACK: "30d"
  TRUEDATA_ENABLED: "false"
  PROMETHEUS_URL: ""
  PROMETHEUS_TIMEOUT_SECONDS: "8"
  TRADEOPS_DEFAULT_TENANT_NAME: "Lemonn"
  # Leave false until tenant_grants includes Lemonn operators (default needs a
  # grant once this is true). Flip to "true" only after tradeops-tenant-secrets
  # is applied; the API pod already mounts that Secret and the journal dir.
  TRADEOPS_MULTI_TENANT: "false"
  TRADEOPS_TENANT_SECRETS_DIR: "/etc/tradeops/tenant-secrets"
  TRADEOPS_TENANT_JOURNAL_DIR: "/data/tenant-journals"
  TRUEDATA_SYMBOLS: "RELIANCE-EQ,NIFTY-I,BANKNIFTY-I"
  MARKET_FLUSH_INTERVAL_SECONDS: "1"
