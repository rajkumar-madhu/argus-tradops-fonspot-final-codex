apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tradeops-vault
spec:
  provider:
    vault:
      server: https://vault.example.internal
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tradeops
          serviceAccountRef:
            name: tradeops-api
            namespace: tradeops
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tradeops-secrets
  namespace: tradeops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tradeops-vault
  target:
    name: tradeops-secrets
    creationPolicy: Owner
  data:
    - secretKey: ELASTICSEARCH_API_KEY
      remoteRef: {key: tradeops/production, property: elasticsearch_api_key}
    - secretKey: DATABASE_URL
      remoteRef: {key: tradeops/production, property: database_url}
    - secretKey: REDIS_URL
      remoteRef: {key: tradeops/production, property: redis_url}
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef: {key: tradeops/production, property: keycloak_client_secret}
