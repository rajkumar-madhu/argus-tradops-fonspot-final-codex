# Single-node Redis and Postgres for non-production environments (excluded from
# kustomization.yaml). Hardened anyway: non-root, capabilities dropped, bounded.
# Production uses k8s/ha/ (CloudNativePG, Redis HA).
apiVersion: v1
kind: Service
metadata:
  name: tradeops-redis
  namespace: tradeops
spec:
  selector: {app: tradeops-redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tradeops-redis
  namespace: tradeops
spec:
  serviceName: tradeops-redis
  replicas: 1
  selector:
    matchLabels: {app: tradeops-redis}
  template:
    metadata:
      labels: {app: tradeops-redis}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: tradeops-postgres
  namespace: tradeops
spec:
  selector: {app: tradeops-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tradeops-postgres
  namespace: tradeops
spec:
  serviceName: tradeops-postgres
  replicas: 1
  selector:
    matchLabels: {app: tradeops-postgres}
  template:
    metadata:
      labels: {app: tradeops-postgres}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: tradeops}
            - {name: POSTGRES_USER, value: tradeops}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: tradeops-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U tradeops -d tradeops"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U tradeops -d tradeops"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 20Gi}}
