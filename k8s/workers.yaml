apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradeops-collector
  namespace: tradeops
spec:
  replicas: 2
  selector: {matchLabels: {app: tradeops-collector}}
  template:
    metadata:
      labels: {app: tradeops-collector}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # Leader and standby on different nodes, so a node loss hands the lease
      # over instead of taking both replicas down together.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: tradeops-collector}}
      containers:
        - name: collector
          image: your-registry/tradeops-backend:RELEASE_REQUIRED
          command: ["python", "-m", "app.workers.collector"]
          envFrom:
            - configMapRef: {name: tradeops-config}
            - secretRef: {name: tradeops-secrets}
          env: [{name: WORKER_METRICS_PORT, value: "9108"}]
          ports: [{name: metrics, containerPort: 9108}]
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        # readOnlyRootFilesystem is on, so anything that writes a temp file needs
        # an explicit writable mount.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tradeops-collector-metrics
  namespace: tradeops
  labels: {app: tradeops-collector}
spec:
  selector: {app: tradeops-collector}
  ports: [{name: metrics, port: 9108, targetPort: metrics}]
---
