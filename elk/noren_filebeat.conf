# Logstash pipeline for the Noren journal. Corrected from the supplied
# linkedeye-analytics-ls noren_filebeat.conf. Changes, each load-bearing:
#
# 1. document_id is deterministic, so a Filebeat registry loss, a Logstash
#    persisted-queue replay or an ES 429 retry overwrites the same document
#    instead of creating a duplicate. Seqno is the journal's own sequence.
# 2. One output. The second copy to noren-*-history had no reader (the API's
#    NOREN_HISTORY_INDEX is unused) and doubled index cost; retention is now
#    ILM on the -intraday alias (elk/noren-ilm-policy.json) instead of nothing.
# 3. PII never reaches the index. PanNum/IpAddr/OTP/DOB/etc. are removed here;
#    the API masks defensively on read as well, but Kibana users bypass the API.
# 4. The json filter is gone: the beats codec already decoded the line, and the
#    duplicate filter produced a _jsonparsefailure per event.
# 5. Events with no msg_type go to a quarantine index instead of the literal
#    "noren-%{msg_type}-intraday".
# 6. linkedeye_cleanup is derived from the EVENT date, not the ingest date.

input {
  beats {
    id    => "noren_filebeat"
    port  => 5044
    codec => "json"
  }
}

filter {
  mutate {
    remove_field => [ "message", "host", "agent", "log", "ecs", "input", "event",
                      "PanNum", "IpAddr", "ExchUserInfo", "ParticId", "Question2fas", "LoginProcId",
                      "[Userdetails][Dob]", "[Userdetails][UserName]", "[Userdetails][LastLoginIp]",
                      "[Userdetails][LastLoginMac]", "[Userdetails][UserSessOtp]", "[Userdetails][PrevPasswords]",
                      "[Userdetails][User2faDetails]", "[Userdetails][Login2faDatas]", "[Userdetails][UserDpinDetails]" ]
  }

  # Event time. @timestamp stays as the beats receive time on purpose: the API
  # computes ingestion lag as (@timestamp - NorenTimeStamp_N).
  if [NorenTimeStamp] {
    date {
      match         => [ "NorenTimeStamp", "UNIX" ]
      target        => "NorenTimeStamp_N"
      tag_on_failure => [ "_noren_time_failure" ]
    }
  }

  if ![msg_type] {
    mutate { add_field => { "[@metadata][index]" => "noren-unclassified-intraday" } }
  } else {
    mutate { add_field => { "[@metadata][index]" => "noren-%{msg_type}-intraday" } }
  }

  # Stable identity: journal sequence + event clock. Seqno alone would collide
  # across a journal restart; the timestamp pair makes it unique per line.
  if [Seqno] and [NorenTimeStamp] {
    mutate { add_field => { "[@metadata][doc_id]" => "%{msg_type}-%{Seqno}-%{NorenTimeStamp}-%{NorenNsecs}" } }
  } else {
    fingerprint {
      source      => [ "msg_type", "msg_seq", "NorenTimeStamp", "NorenNsecs", "UserSessId", "Keys" ]
      concatenate_sources => true
      method      => "SHA256"
      target      => "[@metadata][doc_id]"
    }
  }

  if [NorenTimeStamp_N] {
    ruby { code => "event.set('linkedeye_cleanup', event.get('NorenTimeStamp_N').time.strftime('%Y.%m.%d'))" }
  } else {
    mutate { add_field => { "linkedeye_cleanup" => "%{+YYYY.MM.dd}" } }
  }
}

output {
  elasticsearch {
    hosts       => "${ANALYTICS_ES_SERVICE_HOST}:9200"
    user        => "${ANALYTICS_ES_USER:logstash_writer}"
    password    => "${ANALYTICS_ES_PASSWORD}"
    index       => "%{[@metadata][index]}"
    document_id => "%{[@metadata][doc_id]}"
    action      => "index"
    ilm_enabled => false
    # Retention is the ILM policy attached via the index template
    # (elk/noren-index-template.json -> "index.lifecycle.name": "tradeops-noren").
  }
}
