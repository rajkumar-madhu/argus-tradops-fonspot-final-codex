# UAT overlay.
#
# CONFIRM THE NAMESPACE BELOW against `kubectl get ns | grep -i uat` before
# applying. It is the one value here that cannot be derived from the repo —
# nothing in this tree describes a UAT environment.
#
#   kustomize edit set image \
#     your-registry/tradeops-backend=<registry>/tradeops-backend@sha256:<digest> \
#     your-registry/tradeops-frontend=<registry>/tradeops-frontend@sha256:<digest>
#   kubectl --context <ctx> apply -k deploy/uat
#
# The RELEASE_REQUIRED tag is left in place so a forgotten digest fails at
# image pull rather than deploying something unintended.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tradeops-uat

resources:
- ../../k8s

# Private-registry pull secret. Applied here rather than in the base so each
# environment can hold its own GitLab deploy token — a UAT token should not be
# able to pull, or be pulled from, production.
#
# Create it once per namespace (deploy token, scoped read_registry — not a
# personal access token):
#   kubectl -n tradeops-uat create secret docker-registry gitlab-registry \
#     --docker-server=registry.gitlab.com \
#     --docker-username=<deploy-token-username> \
#     --docker-password=<deploy-token>
#
# Targets every Deployment and the migrate Job: only the API Deployment has a
# ServiceAccount, so attaching the secret to a ServiceAccount would miss the
# frontend, the three workers and the Job.
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: gitlab-registry
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: gitlab-registry
  target:
    kind: Job
images:
- digest: sha256:926a7eb2be13eb9f2d785a94796c11c150db4397e93d84f268dde160a6d12680
  name: your-registry/tradeops-backend
  newName: registry.gitlab.com/rajkumar.madhu2021/tradops/tradeops-backend
- digest: sha256:c2c74d1d1501b8860b2457102aff53647511c5aed88cd8b196be1b08c23700d8
  name: your-registry/tradeops-frontend
  newName: registry.gitlab.com/rajkumar.madhu2021/tradops/tradeops-frontend
